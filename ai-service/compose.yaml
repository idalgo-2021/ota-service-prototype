services:
  ai-db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    ports:
      - "${AI_DB_PORT:-55432}:5432"
    volumes:
      - ./_data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ai-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      AI_DB_HOST: ai-db
      AI_DB_PORT: 5432
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      ai-db:
        condition: service_healthy
