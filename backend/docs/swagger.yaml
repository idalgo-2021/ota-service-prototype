        description: Optional positive listing type IDs.
        items:
          type: integer
        type: array
      location_ids:
        description: Optional for staff; for other users provide nonempty location_ids
          or geo. IDs must be positive.
        items:
          type: integer
        type: array
      max_distance_km:
        description: Optional inclusive maximum straight-line distance from the location
          centre in kilometres.
        type: number
      max_overall_rating:
        description: Optional inclusive maximum of the listing's stored mean overall
          review score (1 to 10).
        type: number
