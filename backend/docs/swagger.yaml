        name: location_id
        type: integer
      - description: Language (default en)
        enum:
        - en
        - ru
        in: query
        name: lang
        type: string
      - description: tour, goods or service
        in: query
        name: product_type
        type: string
      - description: Attribute name
        in: query
        name: attribute_key
        type: string
      - description: Exact attribute value
        in: query
        name: attribute_value
        type: string
      - description: Active three-letter currency code for displayed prices; defaults
          to the base currency; unknown codes return 400
        in: query
        name: currency
        type: string
      - description: 'Price sorting: price_asc or price_desc; when omitted, the default
          catalog order is preserved'
