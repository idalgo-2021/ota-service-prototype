  /listings/search:
    post:
      consumes:
      - application/json
      description: 'Required in every request: availability_mode. For anonymous and
        regular users, provide location_ids or geo. Mode ignore requires no stay fields;
        any_unit requires check_in_date and nights; for_guests additionally requires
        adults_count. Without sort, ignore mode returns newest listings first, while
        date-based modes return lower nightly prices first. Distance bounds are inclusive
        kilometres from the configured location centre; rating bounds are inclusive
        scores from 1 to 10. Listings without a calculated value are excluded when
        the corresponding bound is set. Rating sorting puts unrated listings last.
        Geo points are [longitude,latitude]; the server searches their convex hull
        and radius_m metres beyond it.'
      parameters:
      - description: Language (default en)
        enum:
        - en
        - ru
        in: query
        name: lang
        type: string
      - description: Search filters
        in: body
