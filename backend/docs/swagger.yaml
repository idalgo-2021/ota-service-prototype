        description: Optional inclusive minimum straight-line distance from the location
          centre in kilometres.
        type: number
      min_overall_rating:
        description: Optional inclusive minimum of the listing's stored mean overall
          review score (1 to 10).
        type: number
      nights:
        description: Required for any_unit and for_guests; 1 to 365. Omit for ignore.
        type: integer
      sort:
        allOf:
        - $ref: '#/definitions/domain.SearchSortCriteria'
        description: Optional independent sort directions. When both are provided,
          price is primary and rating is secondary.
