info:
  contact: {}
  description: This is a sample server for a product showcase project.
  termsOfService: http://swagger.io/terms/
  title: Test Project One API
  version: "1.0"
paths:
  /admin/articles:
    get:
      parameters:
      - description: Publication status
        in: query
        name: is_published
        type: boolean
      - description: Filter by text tag
        in: query
        name: tag
        type: string
      - description: Search title or HTML content
        in: query
        name: search
        type: string
      - description: Maximum results
        in: query
        name: limit
        type: integer
      - description: Number of results to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/article.ArticleResponse'
                  type: array
                meta:
                  $ref: '#/definitions/handler.Meta'
              type: object
      security:
      - BearerAuth: []
      summary: List travel articles (staff)
      tags:
      - 'Admin: Articles'
    post:
      consumes:
      - application/json
      parameters:
      - description: Article draft
        in: body
        name: article
        required: true
        schema:
          $ref: '#/definitions/article.ArticleCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/article.ArticleResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Create a travel article draft
      tags:
      - 'Admin: Articles'
  /admin/articles/{id}:
    get:
      parameters:
      - description: Article UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/article.ArticleResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get a travel article (staff)
      tags:
      - 'Admin: Articles'
    patch:
      consumes:
      - application/json
      parameters:
      - description: Article UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: article
        required: true
        schema:
          $ref: '#/definitions/article.ArticlePatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/article.ArticleResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Update a travel article
      tags:
      - 'Admin: Articles'
  /admin/articles/{id}/publish:
    patch:
      parameters:
      - description: Article UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/article.ArticleResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Publish or unpublish a travel article
      tags:
      - 'Admin: Articles'
  /admin/articles/{id}/unpublish:
    patch:
      parameters:
      - description: Article UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/article.ArticleResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Publish or unpublish a travel article
      tags:
      - 'Admin: Articles'
  /admin/bookings:
    get:
      description: Date ranges are inclusive and filter check-in or check-out dates
        independently. All filters can be combined.
      parameters:
      - description: Listing UUID
        in: query
        name: listing_id
        type: string
      - description: Client UUID
        in: query
        name: client_id
        type: string
      - description: 'Booking status: confirmed, checked_in, completed or canceled'
        in: query
        name: status
        type: string
      - description: Check-in date from YYYY-MM-DD, inclusive
        in: query
        name: check_in_from
        type: string
      - description: Check-in date to YYYY-MM-DD, inclusive
        in: query
        name: check_in_to
        type: string
      - description: Check-out date from YYYY-MM-DD, inclusive
        in: query
        name: check_out_from
        type: string
      - description: Check-out date to YYYY-MM-DD, inclusive
        in: query
        name: check_out_to
        type: string
      - description: 'Sort field: created_at, check_in_date or check_out_date (default
          created_at)'
        enum:
        - created_at
        - check_in_date
        - check_out_date
        in: query
        name: sort_by
        type: string
      - description: 'Sort direction: asc or desc (default desc for created_at, asc
          for stay dates)'
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      - description: Maximum results (default 20, maximum 100 unless configured otherwise)
        in: query
        name: limit
        type: integer
      - description: Number of results to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/booking.BookingResponse'
                  type: array
                meta:
                  $ref: '#/definitions/handler.Meta'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                error:
                  $ref: '#/definitions/handler.ErrorInfo'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                error:
                  $ref: '#/definitions/handler.ErrorInfo'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                error:
                  $ref: '#/definitions/handler.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: List all bookings (staff)
      tags:
      - 'Admin: Bookings'
  /admin/bookings/{id}:
    get:
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/booking.BookingResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get booking (staff)
      tags:
      - 'Admin: Bookings'
  /admin/bookings/{id}/cancel:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: string
      - description: Cancellation reason is required
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/booking.CancelBookingRequest'
      produces:
      - application/json
